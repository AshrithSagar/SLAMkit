[project]
name = "slamkit"
version = "0.1.0"
description = "SLAM"
readme = "README.md"
authors = [{ name = "Ashrith Sagar", email = "ashrithy@iisc.ac.in" }]
requires-python = ">=3.14"
dependencies = ["numpy>=2.5.1", "typingkit"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
typingkit = { git = "https://github.com/AshrithSagar/typingkit.git", rev = "main" }
